<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup Live | Hiron Khandaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pitch-green: #0a3622;
      --deep-green: #061e13;
      --gold: #c9a84c;
      --gold-light: #e8c86a;
      --white: #f5f5f0;
      --muted: #8a9e8f;
      --surface: #0d2b1a;
      --line: rgba(201,168,76,0.25);
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--deep-green);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Grass texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 60px,
          rgba(255,255,255,0.012) 60px,
          rgba(255,255,255,0.012) 61px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 40px,
          rgba(255,255,255,0.012) 40px,
          rgba(255,255,255,0.012) 41px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--line);
      background: rgba(6,30,19,0.85);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .brand-text {
      line-height: 1;
    }

    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.45rem;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(201,168,76,0.1);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 0.28rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #e04040;
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.75); }
    }

    /* ── Main layout ── */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.4rem 1.8rem 1.2rem;
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Match info bar ── */
    .match-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .match-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      letter-spacing: 0.06em;
      color: var(--white);
      line-height: 1;
    }

    .match-title span {
      color: var(--gold);
    }

    .match-meta {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Player wrapper ── */
    .player-shell {
      position: relative;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      /* 16:9 but fill available height */
      aspect-ratio: 16 / 9;
      width: 100%;
      max-height: calc(100vh - 220px);
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 8px 40px rgba(0,0,0,0.7),
        0 0 80px rgba(10,54,34,0.4);
    }

    .player-shell iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Corner accents */
    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold);
      border-style: solid;
      z-index: 2;
      pointer-events: none;
    }
    .corner.tl { top: 8px; left: 8px;  border-width: 2px 0 0 2px; }
    .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
    .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    /* ── Controls row ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.1rem 0;
    }

    .ctrl-group {
      display: flex;
      gap: 0.5rem;
    }

    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 0.38rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .ctrl-btn:hover {
      background: rgba(201,168,76,0.12);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .ctrl-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .hint {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--line);
      padding: 0.65rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
      background: rgba(6,30,19,0.7);
    }

    footer p {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    /* ── Pitch stripes on footer gap ── */
    .pitch-stripe {
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--pitch-green) 0px,
        var(--pitch-green) 40px,
        #0d4728 40px,
        #0d4728 80px
      );
      opacity: 0.6;
      position: relative;
      z-index: 10;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0.7rem 1rem; }
      main   { padding: 1rem 0.8rem; }
      footer { padding: 0.6rem 1rem; }
      .player-shell { max-height: calc(100vh - 180px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- Ball SVG -->
      <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="16" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <polygon points="18,4 21.5,13.5 31.5,13.5 23.5,19.5 26.5,29 18,23 9.5,29 12.5,19.5 4.5,13.5 14.5,13.5" fill="none" stroke="#c9a84c" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="18" cy="18" r="2.5" fill="#c9a84c" opacity="0.5"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">FIFA World Cup Live</div>
        <div class="brand-sub">by Hiron Khandaker</div>
      </div>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span>
      Live Stream
    </div>
  </header>

  <main>
    <div class="match-bar">
      <div class="match-title">⚽ World Cup <span>Live</span></div>
      <div class="match-meta" id="clock">Loading time…</div>
    </div>

    <div class="player-shell" id="playerShell">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <iframe
        id="streamFrame"
        src="https://junkieembeds.pages.dev/embed/fox-usa"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        scrolling="no"
        frameborder="0"
      ></iframe>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <button class="ctrl-btn" onclick="reloadStream()">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
          Reload Stream
        </button>
        <button class="ctrl-btn" onclick="toggleFullscreen()">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          Fullscreen
        </button>
      </div>
      <span class="hint">If stream doesn't load, try reloading</span>
    </div>
  </main>

  <div class="pitch-stripe"></div>

  <footer>
    <p>⚽ FIFA World Cup Live Stream &mdash; <a href="https://github.com/hironkhandaker" target="_blank" rel="noopener">Hiron Khandaker</a></p>
    <p>Stream provided by external source &bull; For personal use only</p>
  </footer>

  <script>
    // Live clock
    function updateClock() {
      const now = new Date();
      const opts = { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', timeZoneName:'short' };
      document.getElementById('clock').textContent = now.toLocaleString('en-GB', opts);
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Reload stream
    function reloadStream() {
      const frame = document.getElementById('streamFrame');
      const src = frame.src;
      frame.src = '';
      setTimeout(() => { frame.src = src; }, 200);
    }

    // Fullscreen
    function toggleFullscreen() {
      const shell = document.getElementById('playerShell');
      if (!document.fullscreenElement) {
        shell.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
  </script>

</body>
</html>
